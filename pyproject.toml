[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-ghostprovider"
version = "1.7.5"
description = "TUI for self-hosting & localhost management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.41.0",
    "requests>=2.28.0",
]

[project.scripts]
demo-ghostprovider = "demo_ghostprovider.__main__:run"

[tool.setuptools.packages.find]
where = ["software"]
include = ["demo_ghostprovider*"]

[tool.setuptools.package-data]
demo_ghostprovider = ["py.typed", "theme.tcss"]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["software"]
testpaths = ["tests"]
