# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Gate: `cargo deny check` (advisories + bans + licenses) should pass before
# pushing any tag. Run locally with `cargo install cargo-deny --locked` and,
# via the workflow in .github/workflows/ci.yml.

[advisories]
version = 2
ignore = [
    # Transitive proc-macro pulled by ratatui (our TUI). We never call into it;
    # it only exists to synthesize identifiers at compile time. The advisory is
    # "unmaintained" with no patched release, and there is no drop-in swap short
    # of replacing the TUI framework. Not exploitable in this binary.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
