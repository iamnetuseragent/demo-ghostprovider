# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Gate: `cargo deny check` (advisories + bans + licenses) should pass before
# pushing any tag. Run locally with `cargo install cargo-deny --locked` and,
# via the workflow in .github/workflows/ci.yml.

[advisories]
version = 2
ignore = [
    # Transitive via ureq's `json` feature -> cookie_store -> cookie -> time.
    # RUSTSEC-2026-0009 is a stack-exhaustion DoS in the RFC 2822 *parser*
    # (time::Date::parse & friends). Our code calls none of those functions and
    # never feeds user input into the `time` crate (it uses only std::time and
    # a hand-rolled civil_from_days). Upgrading time to 0.3.47 would bump MSRV
    # beyond our pinned 1.85. Not exploitable in this binary.
    "RUSTSEC-2026-0009",
    # Transitive proc-macro pulled by ratatui (our TUI). We never call into it;
    # it only exists to synthesize identifiers at compile time. The advisory is
    # "unmaintained" with no patched release, and there is no drop-in swap short
    # of replacing the TUI framework. Not exploitable in this binary.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "allow"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
