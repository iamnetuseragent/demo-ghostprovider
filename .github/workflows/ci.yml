# CI gate for every push/PR: lint, test, and a dependency advisory/license
# audit via cargo-deny. The release path (signed static musl build) lives in
# release.yml and is intentionally separate: CI here fails fast on the cheap
# checks and never publishes anything.
#
# Actions are pinned by full commit SHA to control supply-chain drift; bump a
# SHA only by recording the reason in the commit message (same discipline as
# release.yml).

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain (MSRV 1.85)
        uses: dtolnay/rust-toolchain@fd9746c7f0e6d59efd2f97e0e1551b3c9e9f3a5c # v1.0.2
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa236ec855898878e # v2.7.7

      # Fail on warnings, deny-by-default clippy lints, and cross-check tests.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (lib)
        run: cargo test --lib

      - name: Test (integration)
        run: cargo test --test '*' -- --test-threads=1

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned toolchain (latest stable for cargo-deny)
        uses: dtolnay/rust-toolchain@fd9746c7f0e6d59efd2f97e0e1551b3c9e9f3a5c # v1.0.2

      - name: Cache cargo
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa236ec855898878e # v2.7.7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@240de6d9ff95ffd09b1dbef34190ea4d186e94b8 # v2.2.0
        with:
          command: check
          arguments: --all-features --advisories --bans --licenses
