[package]
name = "demo-ghostprovider"
version = "0.0.18"
edition = "2024"
rust-version = "1.85"
description = "Local-first demo hosting panel: deploy three curated self-hosted services as hardened systemd user services. Rust rewrite of demo-ghostprovider."
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = "z"
